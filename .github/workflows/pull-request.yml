name: 🔍 Pull Request Checks

# Solo `pull_request`: con `pull_request_target` los jobs hacían checkout de la
# rama base (main) en lugar del código del PR, así que probaban main y
# duplicaban cada check.
on:
  pull_request:
    branches: [main, develop]

# Permisos mínimos por defecto; el job de revisión automática pide los suyos.
permissions:
  contents: read

# Si se empuja otro commit al PR, se cancela la corrida anterior.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # Job de análisis de código
  code-analysis:
    name: 🔍 Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para análisis de cambios

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Run linting
        run: pnpm lint

      - name: 🎨 Check formatting
        run: pnpm format:check

      - name: 🔒 Security audit
        run: pnpm audit --audit-level moderate

      - name: 📊 Bundle size analysis
        run: pnpm build && npx bundlewatch --config .bundlewatch.json

  # Job de tests rápidos
  quick-tests:
    name: ⚡ Quick Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run unit tests
        run: pnpm test

      - name: 📊 Run tests with coverage
        run: pnpm test:coverage

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage/
          fail_ci_if_error: false
          verbose: true

  # Job de build validation
  build-check:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📋 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build project
        run: pnpm build

      - name: 📋 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-${{ github.event.number }}
          path: dist/
          retention-days: 7

  # Job de revisión automática
  auto-review:
    name: 🤖 Auto Review
    runs-on: ubuntu-latest
    needs: [code-analysis, quick-tests, build-check]
    # En PRs desde forks el token es de solo lectura y no puede comentar ni etiquetar
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: write
      pull-requests: write
    env:
      # Resultado real de cada job (success, failure, cancelled o skipped)
      RESULTS: ${{ toJSON(needs) }}

    steps:
      - name: 📊 Generate PR Summary
        uses: actions/github-script@v8
        with:
          script: |
            // Antes se buscaban los check runs por id de job, pero GitHub los
            // nombra con el `name` visible ("🔍 Code Analysis"), así que nunca
            // coincidían y el resumen decía "todo pasó" aunque fallara algo.
            const needs = JSON.parse(process.env.RESULTS);
            const results = Object.fromEntries(
              Object.entries(needs).map(([job, { result }]) => [job, result]),
            );

            const allPassed = Object.values(results).every(result => result === 'success');
            const hasFailures = Object.values(results).some(result => result === 'failure' || result === 'cancelled');

            let comment = `## 🤖 Auto Review Summary\n\n`;
            comment += `**Status:** ${allPassed ? '✅ All checks passed' : hasFailures ? '❌ Some checks failed' : '⚠️ Some checks are pending'}\n\n`;

            comment += `### Check Results:\n`;
            Object.entries(results).forEach(([job, result]) => {
              const emoji = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⏳';
              comment += `- ${emoji} **${job}**: ${result || 'pending'}\n`;
            });

            comment += `\n### 📋 Next Steps:\n`;
            if (allPassed) {
              comment += `- ✅ Ready for manual review\n`;
              comment += `- 🚀 Can be merged if approved\n`;
            } else if (hasFailures) {
              comment += `- ❌ Please fix the failing checks\n`;
              comment += `- 🔍 Review the error logs\n`;
            } else {
              comment += `- ⏳ Waiting for all checks to complete\n`;
            }

            comment += `\n---\n*This is an automated review. Please review the code manually before merging.*`;

            // Buscar comentarios existentes del bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🤖 Auto Review Summary')
            );

            if (botComment) {
              // Actualizar comentario existente
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              // Crear nuevo comentario
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: 🏷️ Add labels
        uses: actions/github-script@v8
        with:
          script: |
            // Antes se buscaban los check runs por id de job, pero GitHub los
            // nombra con el `name` visible ("🔍 Code Analysis"), así que nunca
            // coincidían y el resumen decía "todo pasó" aunque fallara algo.
            const needs = JSON.parse(process.env.RESULTS);
            const results = Object.fromEntries(
              Object.entries(needs).map(([job, { result }]) => [job, result]),
            );

            const allPassed = Object.values(results).every(result => result === 'success');
            const hasFailures = Object.values(results).some(result => result === 'failure' || result === 'cancelled');

            // Obtener labels actuales
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const currentLabels = issue.labels.map(label => label.name);
            const labelsToAdd = [];
            const labelsToRemove = [];

            if (allPassed) {
              labelsToAdd.push('✅ checks-passed');
              labelsToRemove.push('❌ checks-failed', '⚠️ checks-pending');
            } else if (hasFailures) {
              labelsToAdd.push('❌ checks-failed');
              labelsToRemove.push('✅ checks-passed', '⚠️ checks-pending');
            } else {
              labelsToAdd.push('⚠️ checks-pending');
              labelsToRemove.push('✅ checks-passed', '❌ checks-failed');
            }

            // Agregar labels
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labelsToAdd,
              });
            }

            // Remover labels
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              } catch (error) {
                // Label no existe, ignorar error
              }
            }
